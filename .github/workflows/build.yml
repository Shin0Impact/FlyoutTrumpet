name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GitVersion needs the full history

      # GitVersion (EarTrumpet's version numbering) insists on a 'master' branch existing.
      - name: Create master branch for GitVersion
        run: git branch master

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore EarTrumpet.vs15.sln

      # Build only the app itself (the MSIX packaging project needs a store signing identity).
      - name: Build EarTrumpet
        run: msbuild EarTrumpet\EarTrumpet.csproj /p:Configuration=Release /p:Platform=x86 /p:ChannelVersion= /m /v:minimal

      # The app reads this to know which build it is (for "Check for updates").
      - name: Stamp build number
        run: Set-Content -Path Build\Release\build.txt -Value ${{ github.run_number }}

      - name: Zip the portable build
        run: Compress-Archive -Path Build\Release\* -DestinationPath EarTrumpet-custom.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EarTrumpet-custom
          path: EarTrumpet-custom.zip

      # A public release is what the in-app updater (and you) download from.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: EarTrumpet-custom.zip
