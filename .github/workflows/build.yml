name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GitVersion needs the full history

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore EarTrumpet.vs15.sln

      # Build only the app itself (the MSIX packaging project needs a store signing identity).
      - name: Build EarTrumpet
        run: msbuild EarTrumpet\EarTrumpet.csproj /p:Configuration=Release /p:Platform=x86 /p:ChannelVersion= /m /v:minimal

      - name: Zip the portable build
        run: Compress-Archive -Path Build\Release\* -DestinationPath EarTrumpet-custom.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EarTrumpet-custom
          path: EarTrumpet-custom.zip
